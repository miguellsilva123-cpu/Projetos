<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Carrossel — Sua conversa virou entrevista?</title>
<style>
@font-face{font-family:'Sora';src:url(../../tiktok/serie/fonts/sora.woff2) format('woff2');font-weight:100 800}
@font-face{font-family:'Playfair Display';src:url(../../tiktok/serie/fonts/playfair-italic.woff2) format('woff2');font-style:italic;font-weight:400 900}
html,body{margin:0;background:#0B0C0F}
:root{--red:#E11D2E;--red2:#FF5A66;--ink:#F4F4F1;--mute:#8C9099}
#pano{position:relative;width:8640px;height:1350px;overflow:hidden;background:#0A0B0E;font-family:'Sora',sans-serif;color:var(--ink)}
.bg-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(244,244,241,.05) 1.6px,transparent 2.2px);background-size:30px 30px;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 80%)}
.floor{position:absolute;left:0;right:0;top:700px;height:700px;background-image:linear-gradient(rgba(244,244,241,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(244,244,241,.06) 1px,transparent 1px);background-size:90px 90px;transform:perspective(900px) rotateX(70deg);transform-origin:50% 0;-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 70%)}
.glow{position:absolute;border-radius:50%;background:var(--red);filter:blur(160px);opacity:.22}
.glass{position:absolute;box-sizing:border-box;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.018));border:1.5px solid rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 40px 90px rgba(0,0,0,.6);backdrop-filter:blur(14px)}
.pill{display:inline-flex;align-items:center;gap:12px;padding:10px 24px;border-radius:999px;border:1.5px solid rgba(225,29,46,.55);background:rgba(225,29,46,.10);color:var(--red2);font-size:21px;font-weight:600;letter-spacing:.24em}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}
.txt{position:absolute;top:870px;width:1080px;box-sizing:border-box;padding:0 90px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:26px}
.h{font-size:74px;font-weight:600;line-height:1.06;letter-spacing:-.025em}
.h .l2{display:block;color:var(--mute)}
.h em{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;color:var(--red);letter-spacing:0}
.sub{font-size:29px;line-height:1.45;color:#A9ACB4;max-width:820px}
.count{position:absolute;top:64px;font-size:20px;font-weight:600;letter-spacing:.2em;color:#5E626B}
.logo{position:absolute;top:58px;display:flex;align-items:center;gap:18px;font-size:21px;font-weight:600;letter-spacing:.3em}
.logo b{position:relative;width:32px;height:32px;box-sizing:border-box;border:3px solid var(--ink);border-radius:50%}
.logo b::after{content:'';position:absolute;right:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 12px rgba(225,29,46,.9)}
.bub{position:absolute;box-sizing:border-box;padding:18px 26px;border-radius:26px;font-size:28px;line-height:1.3;white-space:nowrap}
.bub.me{background:linear-gradient(160deg,#F0303F,#B5121F);color:#fff;border-bottom-right-radius:8px;box-shadow:0 18px 40px rgba(225,29,46,.35)}
.bub.her{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.10);color:#E6E7EA;border-bottom-left-radius:8px}
.node{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--red);box-shadow:0 0 0 8px rgba(225,29,46,.15),0 0 30px 6px rgba(225,29,46,.55)}
.chip{position:absolute;display:flex;align-items:center;gap:14px;padding:16px 24px;border-radius:18px;font-size:26px;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%}
.arrow{position:absolute;top:1230px;display:flex;align-items:center;gap:14px;font-size:20px;font-weight:600;letter-spacing:.25em;color:#5E626B}
</style>
</head>
<body>
<div id="pano"></div>
<script src="copy.js" onerror="window.COPY=null"></script>
<script>
const D = {
  S1:{pill:'5 SINAIS',titulo1:'Sua conversa virou',titulo2:'entrevista?',sub:'5 sinais de que ela tá respondendo por educação. E como virar o jogo.',chips:['trabalha com quê?','mora onde?','tem irmãos?','curte o quê?']},
  S2:{pill:'SINAL 01',titulo1:'Você pergunta.',titulo2:'Ela responde. Fim.',sub:'Ela nunca devolve a pergunta. Quem puxa assunto é sempre você.',chat:[['trabalha com quê?','no comércio'],['e mora onde?','zona sul'],['legal! curte o quê?','várias coisas']]},
  S3:{pill:'SINAL 02',titulo1:'As respostas',titulo2:'vão encolhendo.',sub:'Da frase pro "aham". Do "aham" pro "kkk". O interesse foi junto.',bolhas:['nossa, nem me fala, foi corrido','foi tranquilo sim','aham','kkk']},
  S4:{pill:'SINAL 03',titulo1:'Você sabe tudo dela.',titulo2:'Ela, nada de você.',sub:'Interrogatório não cria conexão. Ela não conheceu você: só respondeu um formulário.',ela_sabe:['trabalho','bairro','família','gostos'],voce:'nada. você só perguntou.'},
  S5:{pill:'SINAL 04',titulo1:'Toda mensagem sua',titulo2:'termina com "?"',sub:'Pergunta atrás de pergunta cansa. Responder vira obrigação, não vontade.'},
  S6:{pill:'SINAL 05',titulo1:'Pra mandar a próxima,',titulo2:'você precisa pensar.',sub:'Se cada mensagem custa esforço, não é conversa. É você carregando sozinho.',status:['Digitando…','Apagou','Visto 21:14','Sem resposta']},
  S7:{pill:'A VIRADA',titulo1:'Troque pergunta',titulo2:'por comentário.',sub:'Pergunta pede resposta. Comentário com motivo pede conversa.',antes:'curte o quê?',depois:'vi teu story no show. agora preciso saber se valeu a fila',motivos:['o que ela postou','a música','o lugar','amigo em comum']},
  S8:{pill:'SUA VEZ',titulo1:'Salva antes de',titulo2:'mandar a próxima.',sub:'A conversa não morre por falta de assunto. Morre no modo entrevista.',cta_comentar:'Comenta ENTREVISTA se você já fez isso',cta_seguir:'Segue: a série continua amanhã',cta_salvar:'Salva pra reler antes de mandar'},
};
const C = Object.assign({}, D);
if (window.COPY) for (const s of window.COPY.slides) C[s.id] = Object.assign({}, D[s.id], s);
const P = document.getElementById('pano');
const W = 1080;
const add = (html) => P.insertAdjacentHTML('beforeend', html);
const esc = (t) => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');

// fundo contínuo
add(`<div class="bg-dots"></div><div class="floor"></div>`);
[[300,250,700],[1500,420,600],[2900,300,640],[3800,380,700],[4860,260,760],[5900,360,640],[7000,280,760],[8100,380,700]].forEach(([x,y,s])=>add(`<div class="glow" style="left:${x-s/2}px;top:${y-s/2}px;width:${s}px;height:${s}px"></div>`));

// fio vermelho que atravessa todos os slides
const THREAD = 'M -40 640 C 300 640, 520 560, 760 600 S 1180 700, 1500 660 S 2000 560, 2300 600 S 2900 700, 3240 660 S 3700 560, 4000 620 S 4600 700, 4860 640 S 5300 560, 5600 620 S 6200 700, 6480 650 S 6900 560, 7020 470 S 7700 640, 8050 640 L 8300 640';
add(`<svg width="8640" height="1350" style="position:absolute;inset:0;overflow:visible"><defs><filter id="gl"><feGaussianBlur stdDeviation="6"/></filter></defs>
  <path d="${THREAD}" fill="none" stroke="#E11D2E" stroke-width="10" opacity=".35" filter="url(#gl)"/>
  <path d="${THREAD}" fill="none" stroke="#FF4A57" stroke-width="3"/></svg>`);
[[760,600],[1500,660],[2300,600],[3240,660],[4000,620],[4860,640],[5600,620],[6480,650],[7020,470],[8300,640]].forEach(([x,y])=>add(`<div class="node" style="left:${x}px;top:${y}px"></div>`));

// textos e contadores
const ORDER=['S1','S2','S3','S4','S5','S6','S7','S8'];
ORDER.forEach((id,i)=>{
  const c=C[id],x=i*W;
  const t2 = id==='S1' ? `<em>${esc(c.titulo2)}</em>` : `<span class="l2">${esc(c.titulo2)}</span>`;
  add(`<div class="txt" style="left:${x}px"><div class="pill"><i></i>${esc(c.pill)}</div><div class="h">${esc(c.titulo1)}${id==='S1'?'<br>':''}${t2}</div><div class="sub">${esc(c.sub)}</div></div>`);
  add(`<div class="count" style="left:${x+W-150}px">${String(i+1).padStart(2,'0')} / 08</div>`);
  add(`<div class="logo" style="left:${x+80}px"><b></b>O PROTOCOLO</div>`);
  if(i<7) add(`<div class="arrow" style="left:${x+W-230}px">ARRASTA <svg width="34" height="16" viewBox="0 0 34 16" fill="none" stroke="#5E626B" stroke-width="2.5" stroke-linecap="round"><path d="M2 8h28M23 2l7 6-7 6"/></svg></div>`);
});

// S1 — celular com a "entrevista" + perguntas flutuando (uma atravessa para o S2)
{
  const c=C.S1;
  add(`<div class="glass" style="left:300px;top:150px;width:470px;height:700px;border-radius:64px;padding:34px 30px;transform:perspective(1600px) rotateY(-16deg) rotateX(6deg) rotateZ(-3deg);background:linear-gradient(160deg,#16171c,#0d0e11);border:10px solid #24262c">
    <div style="width:130px;height:34px;border-radius:999px;background:#000;margin:0 auto 26px"></div>
    <div style="display:flex;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1.5px solid rgba(255,255,255,.08)"><div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#d8b38a,#6d4c34)"></div><div><div style="font-size:24px;font-weight:600">ana.lu</div><div style="font-size:17px;color:#8C9099">Ativa agora</div></div></div>
    <div style="position:relative;height:470px">
      <div class="bub me" style="right:0;top:26px;font-size:22px;padding:12px 18px">${esc(c.chips[0])}</div>
      <div class="bub her" style="left:0;top:96px;font-size:22px;padding:12px 18px">no comércio</div>
      <div class="bub me" style="right:0;top:166px;font-size:22px;padding:12px 18px">${esc(c.chips[1])}</div>
      <div class="bub her" style="left:0;top:236px;font-size:22px;padding:12px 18px">zona sul</div>
      <div class="bub me" style="right:0;top:306px;font-size:22px;padding:12px 18px">${esc(c.chips[2])}</div>
      <div class="bub her" style="left:0;top:376px;font-size:22px;padding:12px 18px">tenho</div>
    </div></div>`);
  const pos=[[60,210,-6],[720,150,5],[80,560,4],[880,470,-4]];
  c.chips.forEach((q,k)=>{const [x,y,r]=pos[k];add(`<div class="glass chip" style="left:${x}px;top:${y}px;transform:rotate(${r}deg)"><span class="dot" style="background:#E11D2E;box-shadow:0 0 10px #E11D2E"></span>${esc(q)}</div>`)});
}

// S2 — cards de pergunta/resposta empilhados (coluna nasce no S1)
{
  const c=C.S2,x0=W;
  c.chat.forEach(([q,a],k)=>{
    const y=120+k*215, x=x0+190+k*40;
    add(`<div class="glass" style="left:${x}px;top:${y}px;width:640px;height:185px;padding:26px 30px;display:flex;flex-direction:column;gap:16px;${k===2?'border-color:rgba(225,29,46,.45)':''}">
      <div style="display:flex;justify-content:flex-end"><div class="bub me" style="position:static;font-size:25px;padding:12px 20px">${esc(q)}</div></div>
      <div style="display:flex"><div class="bub her" style="position:static;font-size:25px;padding:12px 20px">${esc(a)}</div></div></div>`);
  });
  add(`<div class="glass chip" style="left:${x0+770}px;top:760px;font-size:22px;color:#8C9099"><span class="dot" style="background:#5E626B"></span>ela não perguntou nada de volta</div>`);
}

// S3 — bolhas que encolhem ao longo do fio (a primeira começa no fim do S2)
{
  const c=C.S3,x0=2*W;
  const xs=[x0-180,x0+260,x0+560,x0+800], ys=[300,460,350,500], sc=[1,.86,.74,.64];
  c.bolhas.forEach((t,k)=>add(`<div class="bub her" style="left:${xs[k]}px;top:${ys[k]}px;font-size:${Math.round(34*sc[k])}px;padding:${Math.round(22*sc[k])}px ${Math.round(30*sc[k])}px;opacity:${1-.08*k};${k===3?'border-color:rgba(225,29,46,.6);box-shadow:0 0 50px rgba(225,29,46,.35)':''}">${esc(t)}</div>`));
  add(`<svg width="1080" height="200" style="position:absolute;left:${x0+60}px;top:150px;overflow:visible"><path d="M0 40 C 300 40, 600 90, 960 150" stroke="#8C9099" stroke-width="2" stroke-dasharray="6 10" fill="none"/><path d="M948 136 l14 14 -18 6" stroke="#8C9099" stroke-width="2" fill="none"/></svg>`);
  add(`<div style="position:absolute;left:${x0+90}px;top:120px;font-size:20px;font-weight:600;letter-spacing:.22em;color:#5E626B">TAMANHO DAS RESPOSTAS</div>`);
}

// S4 — dois cards: o que você sabe dela x o que ela sabe de você
{
  const c=C.S4,x0=3*W;
  add(`<div class="glass" style="left:${x0+80}px;top:150px;width:470px;height:560px;padding:36px">
    <div style="font-size:20px;font-weight:600;letter-spacing:.22em;color:#8C9099">VOCÊ SABE DELA</div>
    <div style="display:flex;flex-direction:column;gap:22px;margin-top:30px">${c.ela_sabe.map(t=>`<div style="display:flex;align-items:center;gap:18px;font-size:30px"><span style="width:40px;height:40px;border-radius:12px;background:rgba(225,29,46,.18);border:1.5px solid rgba(225,29,46,.6);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF5A66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span>${esc(t)}</div>`).join('')}</div></div>`);
  add(`<div class="glass" style="left:${x0+640}px;top:250px;width:520px;height:400px;padding:36px 136px 36px 36px;opacity:.9">
    <div style="font-size:20px;font-weight:600;letter-spacing:.22em;color:#8C9099">ELA SABE DE VOCÊ</div>
    <div style="font-size:150px;font-weight:800;color:#2a2c33;line-height:1.1;margin-top:10px">???</div>
    <div style="font-size:26px;color:#8C9099">${esc(c.voce)}</div></div>`);
}

// S5 — "?" 3D brilhante (estilo das moedas da referência)
{
  const x0=4*W;
  const q=(x,y,s,r,o)=>add(`<div style="position:absolute;left:${x}px;top:${y}px;font-size:${s}px;font-weight:800;line-height:1;transform:rotate(${r}deg);opacity:${o};
    background:linear-gradient(150deg,#ff8a92 0%,#F0303F 35%,#9b0f1b 75%,#5a0710 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 #7a0c16) drop-shadow(0 8px 0 #5c0911) drop-shadow(0 12px 0 #44070d) drop-shadow(0 40px 60px rgba(225,29,46,.45))">?</div>`);
  q(x0+330,60,620,-10,1); q(x0+120,330,260,16,.55); q(x0+800,420,200,-22,.4);
  add(`<div class="bub me" style="left:${x0+700}px;top:170px;font-size:24px;padding:12px 20px;opacity:.85">e aí?</div><div class="bub me" style="left:${x0+60}px;top:150px;font-size:24px;padding:12px 20px;opacity:.6">e você?</div>`);
}

// S6 — status de app + janela "digitando"
{
  const c=C.S6,x0=5*W;
  const cols=['#E8B04B','#8C9099','#7CC4FF','#E11D2E'];
  c.status.forEach((t,k)=>add(`<div class="glass chip" style="left:${x0+(k===0?-70:70)}px;top:${170+k*110}px;font-size:24px;padding:14px 22px"><span class="dot" style="background:${cols[k]};box-shadow:0 0 10px ${cols[k]}"></span>${esc(t)}</div>`));
  add(`<div class="glass" style="left:${x0+420}px;top:200px;width:720px;height:430px;padding:34px 134px 34px 34px">
    <div style="display:flex;align-items:center;gap:14px;font-size:24px;color:#8C9099"><span style="width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center">✎</span>Nova mensagem</div>
    <div style="margin-top:34px;height:96px;border-radius:20px;border:1.5px solid rgba(255,255,255,.12);display:flex;align-items:center;padding:0 26px;font-size:30px;color:#D8D9DC">e aí, como foi o<span style="display:inline-block;width:3px;height:36px;background:#E11D2E;margin-left:4px"></span></div>
    <div style="display:flex;gap:18px;margin-top:40px"><div style="flex:1;height:76px;border-radius:18px;border:1.5px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:24px;color:#C9CAD0">Apagar tudo</div><div style="flex:1;height:76px;border-radius:18px;background:rgba(225,29,46,.18);border:1.5px solid rgba(225,29,46,.5);display:flex;align-items:center;justify-content:center;font-size:24px;color:#FF5A66">Enviar mesmo assim</div></div></div>`);
}

// S7 — órbita de motivos + antes/depois
{
  const c=C.S7,x0=6*W,cx=x0+540,cy=470;
  add(`<svg width="1080" height="900" style="position:absolute;left:${x0}px;top:0;overflow:visible"><circle cx="540" cy="${cy}" r="210" fill="none" stroke="rgba(244,244,241,.10)" stroke-width="2"/><circle cx="540" cy="${cy}" r="330" fill="none" stroke="rgba(244,244,241,.07)" stroke-width="2" stroke-dasharray="4 12"/><path d="M 360 ${cy-160} A 240 240 0 0 1 720 ${cy-160}" stroke="#FF4A57" stroke-width="4" fill="none" opacity=".8"/></svg>`);
  add(`<div class="glass" style="left:${cx-90}px;top:${cy-90}px;width:180px;height:180px;border-radius:44px;display:flex;align-items:center;justify-content:center;border-color:rgba(225,29,46,.5);box-shadow:0 0 80px rgba(225,29,46,.35),inset 0 1px 0 rgba(255,255,255,.1)"><div style="position:relative;width:80px;height:80px;border:7px solid #F4F4F1;border-radius:50%;box-sizing:border-box"><div style="position:absolute;right:-12px;top:-12px;width:26px;height:26px;border-radius:50%;background:#E11D2E;box-shadow:0 0 20px #E11D2E"></div></div></div>`);
  const ang=[200,-25,145,35];
  c.motivos.forEach((t,k)=>{const a=ang[k]*Math.PI/180,r=330;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;add(`<div class="glass chip" style="left:${x}px;top:${y}px;transform:translate(-50%,-50%);font-size:23px;padding:12px 20px"><span class="dot" style="background:#E11D2E"></span>${esc(t)}</div>`)});
  add(`<div class="bub her" style="left:${x0-60}px;top:150px;font-size:24px;padding:12px 20px;text-decoration:line-through;color:#8C9099">${esc(c.antes)}</div>`);
  add(`<div class="glass" style="left:${x0+620}px;top:110px;width:520px;padding:20px 124px 20px 24px;border-color:rgba(225,29,46,.45)"><div style="font-size:17px;font-weight:600;letter-spacing:.22em;color:#FF5A66;margin-bottom:10px">COM MOTIVO</div><div style="font-size:24px;line-height:1.35;white-space:normal">${esc(c.depois)}</div></div>`);
}

// S8 — CTA: comentar, seguir, salvar (o fio termina aqui)
{
  const c=C.S8,x0=7*W;
  add(`<div class="glass" style="left:${x0+120}px;top:150px;width:840px;padding:30px 34px">
    <div style="font-size:20px;font-weight:600;letter-spacing:.22em;color:#8C9099;margin-bottom:20px">COMENTÁRIOS</div>
    <div style="display:flex;align-items:center;gap:18px;height:92px;border-radius:999px;border:1.5px solid rgba(255,255,255,.14);padding:0 12px 0 30px;font-size:28px"><span style="flex:1;color:#E6E7EA">${esc(c.cta_comentar)}</span><span style="width:68px;height:68px;border-radius:50%;background:#E11D2E;display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span></div></div>`);
  add(`<div class="glass chip" style="left:${x0+120}px;top:390px;font-size:25px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF5A66" stroke-width="2.4" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>${esc(c.cta_salvar)}</div>`);
  add(`<div class="glass chip" style="left:${x0+120}px;top:500px;font-size:25px;border-color:rgba(225,29,46,.5)"><span style="padding:6px 14px;border-radius:999px;background:#E11D2E;color:#fff;font-size:20px;font-weight:700;letter-spacing:.12em">+ SEGUIR</span>${esc(c.cta_seguir)}</div>`);
  add(`<div style="position:absolute;left:${x0+120}px;top:620px;font-size:20px;font-weight:600;letter-spacing:.22em;color:#5E626B">@OPROTOCOLODAPRESENCA</div>`);
}
window.READY=true;
</script>
</body>
</html>
