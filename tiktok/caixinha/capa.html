<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa — Insisto ou desisto?</title>
<style>
@font-face{font-family:'Sora';src:url(../serie/fonts/sora.woff2) format('woff2');font-weight:100 800}
@font-face{font-family:'Playfair Display';src:url(../serie/fonts/playfair-italic.woff2) format('woff2');font-style:italic;font-weight:400 900}
html,body{margin:0;background:#0B0C0F}
#capa{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0B0C0F;font-family:'Sora',sans-serif;color:#F4F4F1}
.photo{position:absolute;inset:-60px;background:url(../serie/fotos/bar-risada.jpg) center/cover;filter:blur(34px) brightness(.4) saturate(.8)}
.box{position:absolute;left:110px;top:520px;width:860px;border-radius:36px;overflow:hidden;box-shadow:0 50px 120px rgba(0,0,0,.7);transform:rotate(-2deg)}
.hd{background:#15171B;font-size:30px;font-weight:600;text-align:center;padding:26px 30px}
.bd{background:#F4F4F1;color:#3a3c42;font-size:46px;line-height:1.3;text-align:center;padding:36px 46px 42px}
.title{position:absolute;left:60px;right:60px;top:1060px;text-align:center}
.t1{font-weight:800;font-size:132px;line-height:.95;letter-spacing:-.025em;text-transform:uppercase;text-shadow:0 10px 40px rgba(0,0,0,.6)}
.t2{font-family:'Playfair Display',serif;font-style:italic;font-size:96px;line-height:1.05;margin-top:22px}
.t2 em{color:#E11D2E;font-style:italic}
.pd{display:inline-block;width:.15em;height:.15em;border-radius:50%;background:#E11D2E;margin-left:.05em;box-shadow:0 0 .14em rgba(225,29,46,.9)}
.logo{position:absolute;top:276px;left:64px;display:flex;align-items:center;gap:22px;font-size:24px;font-weight:600;letter-spacing:.32em}
.logo b{position:relative;width:38px;height:38px;box-sizing:border-box;border:3px solid #F4F4F1;border-radius:50%}
.logo b::after{content:'';position:absolute;right:-6px;top:-6px;width:14px;height:14px;border-radius:50%;background:#E11D2E;box-shadow:0 0 14px rgba(225,29,46,.9)}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 360px 120px rgba(0,0,0,.78)}
</style>
</head>
<body>
<div id="capa">
  <div class="photo"></div>
  <div class="box"><div class="hd">Manda a sua melhor pergunta…</div><div class="bd">Ela sempre fala “bora marcar sim!”, mas nunca marca. Insisto ou desisto?</div></div>
  <div class="title">
    <div class="t1">insisto ou desisto?</div>
    <div class="t2">nenhum dos <em>dois</em><span class="pd"></span></div>
  </div>
  <div class="vig"></div>
  <div class="logo"><b></b>O PROTOCOLO</div>
</div>
</body>
</html>
