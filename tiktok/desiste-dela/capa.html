<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa — Desiste dela</title>
<style>
@font-face{font-family:'Geist';src:url(../foguinho/fonts/geist.woff2) format('woff2');font-weight:100 900}
html,body{margin:0;background:#000}
#capa{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:'Geist',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.emo{font-family:'Noto Color Emoji';font-weight:400}
.box{position:absolute;left:120px;top:420px;width:840px;border-radius:34px;overflow:hidden}
.box .hd{background:#262626;color:#fff;font-size:30px;font-weight:600;text-align:center;padding:24px 30px}
.box .bd{background:#fff;color:#4a4a4a;font-size:46px;line-height:1.3;text-align:center;padding:34px 46px 40px}
.t{position:absolute;left:60px;right:60px;text-align:center;font-weight:900;letter-spacing:-.03em;line-height:1}
</style>
</head>
<body>
<div id="capa">
  <div class="box"><div class="hd">Manda a sua melhor pergunta…</div><div class="bd">Mando <span class="emo">🔥</span> no direct dela e ela não responde, devo desistir dela?</div></div>
  <div class="t" style="top:860px;font-size:180px;line-height:.95">DESISTE<br>DELA.</div>
  <div class="t" style="top:1240px;font-size:100px;color:#FF2B2B">E DE SER ASSIM.</div>
</div>
</body>
</html>
