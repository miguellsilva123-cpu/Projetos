<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa — Isso não é conversa</title>
<style>
@font-face{font-family:'Sora';src:url(../serie/fonts/sora.woff2) format('woff2');font-weight:100 800}
@font-face{font-family:'Playfair Display';src:url(../serie/fonts/playfair-italic.woff2) format('woff2');font-style:italic;font-weight:400 900}
html,body{margin:0;background:#0B0C0F}
#capa{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 50% 42%,#1d1f25 0%,#0B0C0F 72%);font-family:'Sora',sans-serif;color:#F4F4F1}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(244,244,241,.06) 1.6px,transparent 2.2px);background-size:28px 28px}
.glow{position:absolute;left:220px;top:420px;width:640px;height:700px;border-radius:50%;background:#E11D2E;opacity:.22;filter:blur(150px)}
.line{position:absolute;left:539px;top:0;width:2px;height:350px;background:rgba(244,244,241,.5)}
.pen{position:absolute;left:530px;top:342px;width:20px;height:20px;border-radius:50%;background:#E11D2E;box-shadow:0 0 30px 8px rgba(225,29,46,.4)}
.card{position:absolute;left:170px;top:380px;width:740px;box-sizing:border-box;padding:34px 46px 22px;background:#15171B;border:1.5px solid rgba(255,255,255,.10);border-radius:24px;box-shadow:0 60px 120px rgba(0,0,0,.75);transform:perspective(2200px) rotateX(6deg) rotateZ(-2deg)}
.head{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1.5px solid rgba(244,244,241,.14)}
.head b{font-size:30px;font-weight:800;letter-spacing:.3em}
.lab{font-size:20px;font-weight:600;letter-spacing:.3em;color:#8C9099}
.frow{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1.5px dashed rgba(244,244,241,.14)}
.frow:last-child{border-bottom:0}
.frow span:last-child{font-size:38px;font-weight:600}
.stamp{position:absolute;left:190px;top:560px;width:700px;box-sizing:border-box;padding:14px 0;border:8px solid #E11D2E;border-radius:14px;text-align:center;font-size:84px;font-weight:800;letter-spacing:.04em;color:#E11D2E;box-shadow:inset 0 0 0 5px #15171B,inset 0 0 0 9px rgba(225,29,46,.85),0 0 60px rgba(225,29,46,.25);background:rgba(21,23,27,.55);transform:rotate(-11deg)}
.title{position:absolute;left:60px;right:60px;top:1180px;text-align:center}
.t1{font-weight:800;font-size:116px;line-height:.98;letter-spacing:-.025em;text-transform:uppercase;text-shadow:0 10px 40px rgba(0,0,0,.6)}
.t2{font-family:'Playfair Display',serif;font-style:italic;font-size:124px;line-height:1.05;margin-top:14px}
.t2 em{color:#E11D2E;font-style:italic}
.pd{display:inline-block;width:.15em;height:.15em;border-radius:50%;background:#E11D2E;margin-left:.05em;box-shadow:0 0 .14em rgba(225,29,46,.9)}
.logo{position:absolute;top:276px;left:64px;display:flex;align-items:center;gap:22px;font-size:24px;font-weight:600;letter-spacing:.32em}
.logo b{position:relative;width:38px;height:38px;box-sizing:border-box;border:3px solid #F4F4F1;border-radius:50%}
.logo b::after{content:'';position:absolute;right:-6px;top:-6px;width:14px;height:14px;border-radius:50%;background:#E11D2E;box-shadow:0 0 14px rgba(225,29,46,.9)}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 360px 120px rgba(0,0,0,.78)}
</style>
</head>
<body>
<div id="capa">
  <div class="dots"></div>
  <div class="glow"></div>
  <div class="line"></div>
  <div class="card">
    <div class="head"><b>FICHA</b><span class="lab">Nº 0427</span></div>
    <div class="frow"><span class="lab">PROFISSÃO</span><span>atendente</span></div>
    <div class="frow"><span class="lab">BAIRRO</span><span>zona sul</span></div>
    <div class="frow"><span class="lab">IRMÃOS</span><span>sim</span></div>
    <div class="frow"><span class="lab">HOBBIES</span><span>várias coisas</span></div>
  </div>
  <div class="pen"></div>
  <div class="stamp">FORMULÁRIO</div>
  <div class="title">
    <div class="t1">Isso não é conversa<span class="pd"></span></div>
    <div class="t2">é um <em>formulário</em><span class="pd"></span></div>
  </div>
  <div class="vig"></div>
  <div class="logo"><b></b>O PROTOCOLO</div>
</div>
</body>
</html>
