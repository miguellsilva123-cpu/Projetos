<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa — 5 vacilos que fazem ela esfriar</title>
<style>
@font-face{font-family:'Sora';src:url(../serie/fonts/sora.woff2) format('woff2');font-weight:100 800}
@font-face{font-family:'Playfair Display';src:url(../serie/fonts/playfair-italic.woff2) format('woff2');font-style:italic;font-weight:400 900}
html,body{margin:0;background:#0B0C0F}
#capa{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 50% 42%,#1d1f25 0%,#0B0C0F 72%);font-family:'Sora',sans-serif;color:#F4F4F1}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(244,244,241,.06) 1.6px,transparent 2.2px);background-size:28px 28px}
.glow{position:absolute;left:220px;top:420px;width:640px;height:640px;border-radius:50%;background:#E11D2E;opacity:.2;filter:blur(150px)}
.line{position:absolute;left:539px;top:0;width:2px;height:350px;background:rgba(244,244,241,.5)}
.pen{position:absolute;left:530px;top:342px;width:20px;height:20px;border-radius:50%;background:#E11D2E;box-shadow:0 0 30px 8px rgba(225,29,46,.4)}
.card{position:absolute;left:150px;top:380px;width:780px;box-sizing:border-box;padding:0 34px 28px;background:#15171B;border:1.5px solid rgba(255,255,255,.10);border-radius:24px;box-shadow:0 60px 120px rgba(0,0,0,.75);transform:perspective(2200px) rotateX(6deg) rotateZ(-2deg)}
.head{display:flex;align-items:center;gap:16px;padding:22px 0 18px;border-bottom:1.5px solid rgba(255,255,255,.08);margin-bottom:20px}
.head i{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#f0a5b0,#8a3a52)}
.head b{display:block;font-size:26px}
.head span{font-size:18px;color:#8C9099}
.body{display:flex;flex-direction:column;gap:14px}
.bub{display:inline-block;padding:14px 22px;border-radius:26px;font-size:30px;line-height:1.35;max-width:78%}
.her{align-self:flex-start;background:#26282E;color:#EDEDEF;border-bottom-left-radius:8px}
.me{align-self:flex-end;background:linear-gradient(160deg,#F0303F,#B5121F);color:#fff;border-bottom-right-radius:8px}
.stamp{align-self:center;font-size:18px;font-weight:600;letter-spacing:.2em;color:#8C9099}
.seen{align-self:flex-end;font-size:22px;color:#8C9099}
.meter{position:absolute;left:150px;width:780px;top:1010px;transform:rotate(-2deg)}
.meter div:first-child{display:flex;justify-content:space-between;font-size:18px;font-weight:600;letter-spacing:.25em;color:#8C9099}
.tr{margin-top:12px;height:14px;border-radius:7px;background:rgba(244,244,241,.12)}
.fl{width:12%;height:100%;border-radius:7px;background:#8C9099}
.title{position:absolute;left:60px;right:60px;top:1150px;text-align:center}
.t1{font-weight:800;font-size:170px;line-height:.95;letter-spacing:-.025em;text-transform:uppercase;text-shadow:0 10px 40px rgba(0,0,0,.6)}
.t2{font-family:'Playfair Display',serif;font-style:italic;font-size:104px;line-height:1.05;margin-top:16px}
.t2 em{color:#E11D2E;font-style:italic}
.pd{display:inline-block;width:.15em;height:.15em;border-radius:50%;background:#E11D2E;margin-left:.05em;box-shadow:0 0 .14em rgba(225,29,46,.9)}
.logo{position:absolute;top:276px;left:64px;display:flex;align-items:center;gap:22px;font-size:24px;font-weight:600;letter-spacing:.32em}
.logo b{position:relative;width:38px;height:38px;box-sizing:border-box;border:3px solid #F4F4F1;border-radius:50%}
.logo b::after{content:'';position:absolute;right:-6px;top:-6px;width:14px;height:14px;border-radius:50%;background:#E11D2E;box-shadow:0 0 14px rgba(225,29,46,.9)}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 360px 120px rgba(0,0,0,.78)}
</style>
</head>
<body>
<div id="capa">
  <div class="dots"></div>
  <div class="glow"></div>
  <div class="line"></div>
  <div class="card">
    <div class="head"><i></i><div><b>bia.fit</b><span>Ativa há 5 h</span></div></div>
    <div class="body">
      <div class="bub her">kkkkkk para, sério?? me conta isso direito</div>
      <div class="bub her">aham</div>
      <div class="stamp">5 H DEPOIS</div>
      <div class="bub me">bora marcar alguma coisa?</div>
      <div class="seen">Visto</div>
    </div>
  </div>
  <div class="pen"></div>
  <div class="meter"><div><span>INTERESSE DELA</span><span style="color:#E11D2E">▼</span></div><div class="tr"><div class="fl"></div></div></div>
  <div class="title">
    <div class="t1">5 vacilos</div>
    <div class="t2">que fazem ela <em>esfriar</em><span class="pd"></span></div>
  </div>
  <div class="vig"></div>
  <div class="logo"><b></b>O PROTOCOLO</div>
</div>
</body>
</html>
