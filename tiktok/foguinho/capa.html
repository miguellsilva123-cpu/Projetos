<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa — Desiste do foguinho</title>
<style>
@font-face{font-family:'Geist';src:url(fonts/geist.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:'Geist Mono';src:url(fonts/geist-mono.woff2) format('woff2');font-weight:100 900}
html,body{margin:0;background:#F2EEE7}
#capa{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse 95% 65% at 50% 38%,#FCFAF6 0%,#F2EEE7 58%,#E7E1D6 100%);font-family:'Geist',sans-serif;color:#0E1726;-webkit-font-smoothing:antialiased}
.glow{position:absolute;border-radius:50%;filter:blur(130px)}
.hair{position:absolute;top:0;bottom:0;width:1px;background:rgba(14,23,38,.06)}
.emo{font-family:'Noto Color Emoji';line-height:1}
.mono{font-family:'Geist Mono',monospace;text-transform:uppercase;letter-spacing:.3em}
.logo{position:absolute;top:150px;left:90px;display:flex;align-items:center;gap:16px;font-size:20px;font-weight:500}
.logo b{position:relative;width:28px;height:28px;box-sizing:border-box;border:2.5px solid #0E1726;border-radius:50%}
.logo b::after{content:'';position:absolute;right:-5px;top:-5px;width:11px;height:11px;border-radius:50%;background:#2443F0}
.box{position:absolute;left:120px;top:330px;width:840px;border-radius:34px;overflow:hidden;box-shadow:0 40px 90px -20px rgba(14,23,38,.35),0 0 0 1px rgba(14,23,38,.06);transform:rotate(-2deg)}
.box .hd{background:#262626;color:#fff;font-size:30px;font-weight:600;text-align:center;padding:24px 30px}
.box .bd{background:#fff;color:#4a4a4a;font-size:46px;line-height:1.3;text-align:center;padding:34px 46px 40px}
.t{position:absolute;left:84px;right:60px;font-weight:750;letter-spacing:-.05em;line-height:.98}
.pill{display:inline-block;padding:6px 26px 14px;border-radius:34px;background:#2443F0;vertical-align:-.02em;position:relative}
.pill .emo{display:inline-block;font-size:100px;filter:grayscale(1) brightness(1.15);opacity:.9}
.pill i{position:absolute;left:14px;right:14px;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:#fff;transform:rotate(-30deg)}
.photo{position:absolute;left:90px;top:1240px;width:900px;height:520px;border-radius:44px;overflow:hidden;box-shadow:0 60px 120px -30px rgba(14,23,38,.38)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 58%}
.chap{position:absolute;left:90px;top:715px;display:flex;align-items:center;gap:16px;font-size:22px;color:#4B5565}
.chap b{color:#2443F0;font-weight:600}.chap i{display:block;width:44px;height:2px;background:#2443F0}
</style>
</head>
<body>
<div id="capa">
  <i class="glow" style="left:-150px;top:900px;width:800px;height:800px;background:#C7D1FF;opacity:.55"></i>
  <i class="glow" style="left:500px;top:200px;width:700px;height:700px;background:#EBDDC6;opacity:.6"></i>
  <div class="hair" style="left:64px"></div><div class="hair" style="left:1015px"></div>
  <div class="logo"><b></b><span class="mono">O Protocolo</span></div>
  <div class="box"><div class="hd">Manda a sua melhor pergunta…</div><div class="bd">Mando <span class="emo">🔥</span> no direct dela e ela não responde, devo desistir dela?</div></div>
  <div class="chap mono" style="letter-spacing:.14em"><b>Resposta</b><i></i><span>em 60 segundos</span></div>
  <div class="t" style="top:770px;font-size:150px">Não desiste<br>dela.</div>
  <div class="t" style="top:1072px;font-size:118px;color:#0E1726">Desiste do <span class="pill"><span class="emo">🔥</span><i></i></span></div>
  <div class="photo"><img src="fotos/mao-dia-hd.jpg" alt=""></div>
</div>
</body>
</html>
