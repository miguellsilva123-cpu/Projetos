<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa — Desiste do foguinho</title>
<style>
@font-face{font-family:'Sora';src:url(../serie/fonts/sora.woff2) format('woff2');font-weight:100 800}
@font-face{font-family:'Playfair Display';src:url(../serie/fonts/playfair-italic.woff2) format('woff2');font-style:italic;font-weight:400 900}
html,body{margin:0;background:#060607}
#capa{position:relative;width:1080px;height:1920px;overflow:hidden;background:#060607;font-family:'Sora',sans-serif;color:#F5F3F0}
.photo{position:absolute;inset:-40px;background:url(fotos/mao-celular.jpg) center/cover;filter:brightness(.55)}
.grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,6,7,.5),rgba(6,6,7,.2) 40%,rgba(6,6,7,.92) 75%)}
.box{position:absolute;left:120px;top:440px;width:840px;border-radius:34px;overflow:hidden;box-shadow:0 50px 120px rgba(0,0,0,.7);transform:rotate(-2deg)}
.hd{background:#262626;font-size:30px;font-weight:600;text-align:center;padding:24px 30px}
.bd{background:#fff;color:#4a4a4a;font-size:48px;line-height:1.3;text-align:center;padding:36px 46px 42px}
.fire{display:inline-block;width:.95em;height:1.1em;vertical-align:-.18em}
.title{position:absolute;left:60px;right:60px;top:1080px;text-align:center}
.t1{font-weight:800;font-size:150px;line-height:.92;letter-spacing:-.035em;text-transform:uppercase}
.t2{font-family:'Playfair Display',serif;font-style:italic;font-size:110px;line-height:1;margin-top:20px;display:flex;justify-content:center;align-items:center;gap:26px}
.cross{position:relative;display:inline-block;width:110px;height:126px}
.cross::after{content:'';position:absolute;left:-14px;right:-14px;top:50%;height:12px;margin-top:-6px;border-radius:6px;background:#FF3B3B;transform:rotate(-38deg);box-shadow:0 0 20px rgba(255,59,59,.7)}
.logo{position:absolute;top:276px;left:64px;display:flex;align-items:center;gap:22px;font-size:24px;font-weight:600;letter-spacing:.32em}
.logo b{position:relative;width:38px;height:38px;box-sizing:border-box;border:3px solid #F5F3F0;border-radius:50%}
.logo b::after{content:'';position:absolute;right:-6px;top:-6px;width:14px;height:14px;border-radius:50%;background:#E11D2E;box-shadow:0 0 14px rgba(225,29,46,.9)}
</style>
</head>
<body>
<div id="capa">
  <div class="photo"></div><div class="grad"></div>
  <div class="box"><div class="hd">Manda a sua melhor pergunta…</div><div class="bd">Mando <span class="fire" data-fire></span> no direct dela e ela não responde, devo desistir dela?</div></div>
  <div class="title"><div class="t1">não desiste dela</div><div class="t2">desiste do <span class="cross" data-fire></span></div></div>
  <div class="logo"><b></b>O PROTOCOLO</div>
</div>
<script>
const FIRE=id=>`<svg viewBox="0 0 24 28" style="width:100%;height:100%;display:block"><defs><linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E11D2E"/><stop offset=".55" stop-color="#FF7A1A"/><stop offset="1" stop-color="#FFD25A"/></linearGradient></defs><path fill="url(#${id})" d="M12 28c6 0 10-4 10-9.5 0-5-3.4-8-5-12-1.6 2.2-2.4 4-2.4 5.8C13 10.8 11.6 9 11 5.5 7.2 8.6 2 12.8 2 18.5 2 24 6 28 12 28z"/><path fill="#FFE9A8" d="M12 26c2.6 0 4.4-1.8 4.4-4.2 0-2.3-1.6-3.6-2.4-5.6-1 1.6-2 2.4-2.6 2.4-.4-1.3-.6-2.6-.4-4-2.4 1.8-3.4 4.3-3.4 6.6C7.6 24.2 9.4 26 12 26z" opacity=".75"/></svg>`;
document.querySelectorAll('[data-fire]').forEach((e,i)=>e.insertAdjacentHTML('afterbegin',FIRE('f'+i)));
</script>
</body>
</html>
