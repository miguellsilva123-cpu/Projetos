<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa — Todo homem já perdeu uma</title>
<style>
@font-face{font-family:'Sora';src:url(fonts/sora.woff2) format('woff2');font-weight:100 800}
@font-face{font-family:'Playfair Display';src:url(fonts/playfair-italic.woff2) format('woff2');font-style:italic;font-weight:400 900}
html,body{margin:0;background:#0B0C0F}
#capa{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 50% 42%,#1d1f25 0%,#0B0C0F 72%);font-family:'Sora',sans-serif;color:#F4F4F1}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(244,244,241,.06) 1.6px,transparent 2.2px);background-size:28px 28px}
.glow{position:absolute;left:190px;top:420px;width:700px;height:780px;border-radius:50%;background:#E11D2E;opacity:.32;filter:blur(150px)}
.line{position:absolute;left:539px;top:0;width:2px;height:330px;background:rgba(244,244,241,.5)}
.pen{position:absolute;left:530px;top:322px;width:20px;height:20px;border-radius:50%;background:#E11D2E;box-shadow:0 0 30px 8px rgba(225,29,46,.4)}
.frame{position:absolute;left:215px;top:360px;width:650px;box-sizing:border-box;padding:18px 18px 0;background:#F4F4F1;box-shadow:0 80px 160px rgba(0,0,0,.85);transform:perspective(1800px) rotateY(-9deg) rotateX(4deg) rotateZ(-2.5deg)}
.frame .img{height:760px;overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;filter:saturate(.6) contrast(1.06) brightness(.92)}
.frame .cap{height:64px;display:flex;align-items:center;justify-content:center;font-size:21px;letter-spacing:.2em;color:#4A4D55}
.title{position:absolute;left:70px;right:70px;top:1215px;text-align:center}
.t1{font-weight:800;font-size:92px;line-height:1;letter-spacing:-.025em;text-transform:uppercase;text-shadow:0 10px 40px rgba(0,0,0,.6)}
.t2{font-family:'Playfair Display',serif;font-style:italic;font-size:132px;line-height:1.05;color:#E11D2E;margin-top:10px}
.logo{position:absolute;top:276px;left:64px;display:flex;align-items:center;gap:22px;font-size:24px;font-weight:600;letter-spacing:.32em}
.logo b{position:relative;width:38px;height:38px;box-sizing:border-box;border:3px solid #F4F4F1;border-radius:50%}
.logo b::after{content:'';position:absolute;right:-6px;top:-6px;width:14px;height:14px;border-radius:50%;background:#E11D2E;box-shadow:0 0 14px rgba(225,29,46,.9)}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 360px 120px rgba(0,0,0,.78)}
</style>
</head>
<body>
<div id="capa">
  <div class="dots"></div>
  <div class="glow"></div>
  <div class="line"></div>
  <div class="frame"><div class="img"><img src="fotos/bar-silencio.jpg" alt="Casal em silêncio na mesa de um bar"></div><div class="cap">SÁBADO · 22:40</div></div>
  <div class="pen"></div>
  <div class="title">
    <div class="t1">Todo homem já perdeu uma</div>
    <div class="t2">por um vacilo.</div>
  </div>
  <div class="vig"></div>
  <div class="logo"><b></b>O PROTOCOLO</div>
</div>
</body>
</html>
